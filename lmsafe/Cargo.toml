[package]
name = "lmsafe"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "C FFI bindings for lmsafe (liblmsafe.so)"

[lib]
# One name, one artifact: package, lib, and shipped library all read
# "lmsafe". Nothing in the workspace depends on this crate as a Rust
# library — it is the boundary leaf — so the artifact name is the public one.
name = "lmsafe"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
sysreflect-core.workspace = true
sysreflect-model.workspace = true
lmsafe-zone.workspace = true
serde_json.workspace = true
libc.workspace = true

[lints]
workspace = true

